<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>L-Code Task Pane</title>
    <link rel="stylesheet" href="taskpane.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  </head>
  <body>
    <main>
      <h2>L-Code</h2>
      <p>IDE-grade snippets for Word.</p>

      <label for="lang-select">Language Engine</label>
      <select id="lang-select">
        <option value="cpp">C++ / C</option>
        <option value="go">Go (Golang)</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript / React</option>
      </select>

      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="dark">VS Code Dark+</option>
        <option value="light">Academic Light</option>
      </select>

      <label class="checkbox-container">
        <input type="checkbox" id="inline-check" />
        Inline Code Mode
      </label>

      <button id="format-btn">Format Selection</button>

      <div id="error-msg" style="display: none"></div>
    </main>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="theme.js"></script>
    <script src="ooxml.js"></script>
    <script src="taskpane.js"></script>
    <script src="settings.js"></script>
    <script src="lang.js"></script>
  </body>
</html>
